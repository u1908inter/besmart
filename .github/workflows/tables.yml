name: Mirror difficulty tables

on:
  schedule:
    - cron: "17 19 * * *"   # every day, 04:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_tables.py
      - .github/workflows/tables.yml

permissions:
  contents: write

concurrency:
  group: tables
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download tables
        run: python3 tools/fetch_tables.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tables
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update difficulty table mirrors"
            git pull --rebase origin main
            git push
          fi
